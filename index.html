<script>

// ===== VOICE =====
function speak(text,p=1){
  let s=new SpeechSynthesisUtterance(text);
  s.lang="en-US";s.rate=0.9;s.pitch=p;
  speechSynthesis.speak(s);
}

// ===== REAL DEVICE INFO =====
async function loadRealInfo(){

  let battery="Unknown";
  if(navigator.getBattery){
    let b=await navigator.getBattery();
    battery=Math.floor(b.level*100)+"%";
  }

  let connection=navigator.connection?.effectiveType||"Unknown";

  // GPU
  let gpu="Unknown";
  try{
    let canvas=document.createElement("canvas");
    let gl=canvas.getContext("webgl");
    let debug=gl.getExtension("WEBGL_debug_renderer_info");
    gpu=gl.getParameter(debug.UNMASKED_RENDERER_WEBGL);
  }catch(e){}

  let info=`
  ACCESSING SYSTEM...<br>
  Device: ${navigator.platform}<br>
  Browser: ${navigator.userAgent}<br>
  Language: ${navigator.language}<br>
  Screen: ${screen.width}x${screen.height}<br>
  CPU: ${navigator.hardwareConcurrency || "Unknown"} cores<br>
  RAM: ${navigator.deviceMemory || "Unknown"} GB<br>
  GPU: ${gpu}<br>
  Timezone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}<br>
  Connection: ${connection}<br>
  Online: ${navigator.onLine}<br>
  Cookies: ${navigator.cookieEnabled}<br>
  Audio: ${typeof Audio !== "undefined"}<br>
  Battery: ${battery}<br>
  Time: ${new Date().toLocaleTimeString()}
  `;

  document.getElementById("trackingPanel").innerHTML=info;
}

loadRealInfo();

// ===== MEMORY =====
function memory(){
  let h=localStorage.getItem("history");
  if(h) speak("You tried "+h+" times before");
}
function remember(){
  localStorage.setItem("history",(parseInt(localStorage.getItem("history")||0)+1));
}
memory();

// ===== SECURITY =====
const MAX=5,BLOCK_TIME=3600000;
let attempts=parseInt(localStorage.getItem("attempts"))||MAX;

// ===== FAKE IP =====
function getIP(){
  let ip=localStorage.getItem("ip");
  if(ip)return ip;
  ip="192.168."+Math.random()*255|0+"."+Math.random()*255|0;
  localStorage.setItem("ip",ip);
  return ip;
}

// ===== COUNTDOWN =====
function countdown(){
  let end=parseInt(localStorage.getItem("block"));
  let msg=document.getElementById("msg");

  let int=setInterval(()=>{
    let r=end-Date.now();
    if(r<=0){
      clearInterval(int);
      localStorage.clear();
      location.reload();
    }
    let m=Math.floor(r/60000);
    let s=Math.floor((r%60000)/1000);

    msg.innerHTML=`
    🔒 IP BLOCKED<br>
    IP: ${getIP()}<br>
    Time left: ${m}m ${s}s
    `;
  },1000);
}

// ===== TERMINAL =====
function autoTerminal(){
  let lines=[
    "> accessing system...",
    "> decrypting files...",
    "> downloading user data...",
    "> breach detected..."
  ];
  let msg=document.getElementById("msg");
  let i=0;

  let int=setInterval(()=>{
    msg.innerHTML+="<br>"+lines[i];
    i++;
    if(i>=lines.length)clearInterval(int);
  },800);
}

// ===== GLITCH =====
function glitchAttack(){
  let i=0;
  let int=setInterval(()=>{
    document.body.style.transform=`scale(${1+i*0.02}) rotate(${i*3}deg)`;
    document.body.style.background=i%2?"red":"black";
    i++;
    if(i>10){
      clearInterval(int);
      document.body.style.transform="none";
      cameraPhase();
    }
  },100);
}

// ===== CAMERA =====
function cameraPhase(){
  let msg=document.getElementById("msg");

  msg.innerHTML=`
  Accessing camera...<br>
  Face detected 👁️
  `;

  speak("Accessing camera");

  setTimeout(()=>{
    speak("I can see you",0.6);
    finalBlock();
  },2000);
}

// ===== FINAL BLOCK =====
function finalBlock(){
  document.body.style.background="black";
  localStorage.setItem("block",Date.now()+BLOCK_TIME);
  countdown();
}

// ===== LOGIN =====
function checkKey(){

  let msg=document.getElementById("msg");

  if(localStorage.getItem("block")){
    countdown();
    return;
  }

  let val=document.getElementById("key").value;

  if(val.length!==5){
    msg.innerHTML="Enter 5 digit code";
    speak("Enter five digit code");
    return;
  }

  if(val==="siya0"){
    msg.innerHTML="Access Granted";
    speak("Access granted");

    localStorage.removeItem("attempts");

    setTimeout(()=>{
      window.location.href="https://monnie.neocities.org/";
    },1500);

  } else {

    attempts--;
    localStorage.setItem("attempts",attempts);

    msg.innerHTML="Wrong ("+attempts+")";
    speak("Wrong code");

    navigator.vibrate?.(300);

    remember();

    msg.innerHTML+=`
    <br>Tracking device...<br>
    IP: ${getIP()}<br>
    Location: India<br>
    Camera access granted 👁️
    `;

    if(attempts<=0){
      autoTerminal();
      setTimeout(glitchAttack,3000);
    }
  }
}

// ===== 3AM MODE =====
function creepyMode(){
  if(new Date().getHours()===3){
    let whispers=[
      "I see you","Don't move","You are not safe","Behind you","Run",
      "I am watching","You cannot escape","Your device is mine",
      "I know you","I am inside","They are here","Look around",
      "You are trapped","Stop typing","Too late","Turn back",
      "Why are you here","We see everything","No way out",
      "You are alone","We are coming","Stay still","Don't breathe",
      "You belong to us","It's over","We found you","End is near",
      "System corrupted","Goodbye","Game over"
    ];
    let i=0;
    setInterval(()=>{
      speak(whispers[i%whispers.length],Math.random()+0.5);
      i++;
    },3000);
    document.body.style.background="black";
  } else {
    alert("Only available at 3 AM");
  }
}

</script>
