<script>

// ===== DEVICE INFO =====
function deviceInfo(){
  let info = `
  Device: ${navigator.platform}<br>
  Browser: ${navigator.userAgent.split(" ")[0]}<br>
  Screen: ${screen.width}x${screen.height}<br>
  Time: ${new Date().toLocaleTimeString()}
  `;
  msg.innerHTML += "<br>" + info;
}

// ===== CAMERA FAKE =====

}

// ===== HARD GLITCH =====
function insaneGlitch(){
  let i=0;
  let int=setInterval(()=>{
    document.body.style.transform = `scale(${1+i*0.02}) rotate(${i*2}deg)`;
    document.body.style.background = i%2?"red":"black";
    i++;
    if(i>10){clearInterval(int);document.body.style.transform="none";}

}

  },800);
}
