<!DOCTYPE html>
<html>
<head>
<title>VishavX GOD MODE</title>

<style>
body{margin:0;background:black;color:#00ff00;font-family:monospace;text-align:center;overflow:hidden;}
canvas{position:fixed;top:0;left:0;z-index:-1;}
.section{display:none;}
.glitch{font-size:30px;margin-top:80px;animation:glitch .5s infinite;}
@keyframes glitch{0%{text-shadow:2px 2px red;}50%{text-shadow:-2px -2px lime;}100%{text-shadow:2px -2px blue;}}
input{padding:10px;background:black;border:1px solid red;color:red;}
button{padding:10px;background:red;color:black;border:none;margin:5px;}
.menu{position:fixed;top:10px;right:10px;color:red;cursor:pointer;}
#typingMsg{color:gray;}
</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div class="menu" onclick="show('more')">☰ MORE</div>

<div id="intro"><div id="introText"></div></div>

<div id="main" class="section">
<div class="glitch">WELCOME TO VISHAVX</div>

<p>Enter 5 digit key</p>
<input id="key" maxlength="5"><br>
<div id="typingMsg"></div>

<button onclick="checkKey()">Confirm</button>
<div id="msg"></div>
</div>

<!-- MORE -->
<div id="more" class="section">
<h2>Modes</h2>
<button onclick="startDownload()">Accept</button>
<button onclick="timeMode()">Time Lock Mode</button>
<button onclick="show('main')">Back</button>
</div>

<script>

// ===== MATRIX =====
let c=document.getElementById("matrix"),ctx=c.getContext("2d");
c.height=innerHeight;c.width=innerWidth;
let letters="01".split(""),drops=[];
for(let x=0;x<c.width/14;x++)drops[x]=1;
setInterval(()=>{ctx.fillStyle="rgba(0,0,0,.05)";
ctx.fillRect(0,0,c.width,c.height);
ctx.fillStyle="#0F0";
drops.forEach((y,i)=>{ctx.fillText(letters[Math.random()*2|0],i*14,y);
drops[i]=y>c.height||Math.random()>0.975?0:y+14;});},33);

// ===== VOICE =====
function speak(text){
let s=new SpeechSynthesisUtterance(text);
s.lang="en-US";s.rate=0.95;s.pitch=1;
let v=speechSynthesis.getVoices().find(v=>v.name.includes("Google")||v.name.includes("Female"));
if(v) s.voice=v;
speechSynthesis.speak(s);
}

// ===== INTRO =====
let lines=["Initializing system...","Loading modules...","Accessing server...","System ready..."];
let i=0,j=0;
function typeEffect(){
if(i<lines.length){
if(j<lines[i].length){
introText.innerHTML+=lines[i][j];
j++;setTimeout(typeEffect,40);
}else{introText.innerHTML+="<br>";i++;j=0;setTimeout(typeEffect,300);}
}}
typeEffect();

setTimeout(()=>intro.style.display="none",4000);
setTimeout(()=>{show('main');speak("Please enter five digit key");loadMemory();startVoice();},6000);

// ===== NAV =====
function show(id){
document.querySelectorAll('.section').forEach(s=>s.style.display='none');
document.getElementById(id).style.display='block';
}

// ===== TYPING =====
key.addEventListener("input",()=>typingMsg.innerHTML=key.value.length<5?"Typing...":"");

// ===== VOICE COMMAND =====
function startVoice(){
let rec=new(window.SpeechRecognition||window.webkitSpeechRecognition)();
rec.lang="en-US";
rec.onresult=e=>{
let t=e.results[0][0].transcript.toLowerCase();
if(t.includes("vishav")){show('more');speak("Opening menu");}
};
rec.start();
}

// ===== MEMORY =====
function loadMemory(){
let h=localStorage.getItem("history");
if(h) speak("You tried "+h+" times before");
}
function remember(){localStorage.setItem("history",(+localStorage.getItem("history")||0)+1);}

// ===== SECURITY =====
const MAX=5,BLOCK=3600000;
let attempts=+localStorage.getItem("attempts")||MAX;

function getIP(){
let ip=localStorage.getItem("ip");
if(ip) return ip;
ip="192.168."+Math.random()*255|0+"."+Math.random()*255|0;
localStorage.setItem("ip",ip);
return ip;
}

function countdown(){
let end=+localStorage.getItem("block");
let int=setInterval(()=>{
let r=end-Date.now();
if(r<=0){clearInterval(int);localStorage.clear();msg.innerHTML="Unlocked";return;}
msg.innerHTML="🔒 IP BLOCKED<br>IP:"+getIP()+"<br>"+Math.floor(r/60000)+"m "+Math.floor(r%60000/1000)+"s";
},1000);
}

// ===== LOGIN =====
function checkKey(){

if(localStorage.getItem("block")){countdown();return;}

let v=key.value;

if(v.length!=5){msg.innerHTML="Enter 5 digit";speak("Enter five digit code");return;}

if(v==="siya0"){
msg.innerHTML="Access Granted";
speak("Access granted");
localStorage.removeItem("attempts");
setTimeout(()=>location.href="https://monnie.neocities.org/",1500);
}else{
attempts--;localStorage.setItem("attempts",attempts);
msg.innerHTML="Wrong ("+attempts+")";
speak("Wrong code");
navigator.vibrate?.(300);

remember();
fakeTracking();

if(attempts<=0){
localStorage.setItem("block",Date.now()+BLOCK);
msg.innerHTML="🔒 BLOCKED";
speak("System locked");
countdown();
}}
}

// ===== TRACKING =====
function fakeTracking(){
msg.innerHTML+="<br>Tracking...<br>IP:"+getIP()+"<br>Camera access 👁️";
}

// ===== DOWNLOAD =====
function startDownload(){
let num=Math.floor(Math.random()*999999);
let p=0;
let int=setInterval(()=>{
p+=Math.random()*10|0;
if(p>=100){clearInterval(int);msg.innerHTML="Download Complete";}
else msg.innerHTML="Downloading: user"+num+"_data.zip<br>"+p+"%";
},500);
}

// ===== TIME MODE =====
function timeMode(){
if(new Date().getHours()==3){
document.body.innerHTML="<h1 style='color:red'>YOU ARE NOT ALONE 👁️</h1>";
speak("You are not alone");
setInterval(()=>document.body.style.background=document.body.style.background=="black"?"red":"black",500);
}else alert("Only at 3 AM");
}

// ===== SECRET =====
let s=document.createElement("div");
s.style.position="fixed";s.style.width="50px";s.style.height="50px";
s.style.top="50%";s.style.left="50%";s.style.opacity="0";
s.onclick=showFiles;
document.body.appendChild(s);

// ===== FILE SYSTEM =====
function showFiles(){
document.body.innerHTML="<h2>System Files</h2><p>documents.exe</p><p>camera_logs.db</p><button onclick='glitch()'>Open</button>";
}

// ===== GLITCH =====
function glitch(){
let txt=["ACCESSING","BREACH","OVERRIDE"];
let i=0;
let int=setInterval(()=>{
document.body.style.background=i%2?"red":"black";
document.body.innerHTML="<h1>"+txt[i%3]+"</h1>";
i++;
if(i>8){clearInterval(int);trap();}
},300);
}

// ===== FINAL TRAP =====
function trap(){
document.body.innerHTML="<h1 style='color:red'>ACCESS DENIED</h1>";
setTimeout(()=>{
document.body.innerHTML="<h2 style='color:red'>access camera.exe</h2><p>Downloading photos.dfiles...</p>";
speak("I can see you");
},2000);
}

</script>
</body>
</html>
