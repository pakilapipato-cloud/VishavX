<script>

// ================= VOICE =================
function speak(text, pitch=1){
  let s = new SpeechSynthesisUtterance(text);
  s.lang="en-US";
  s.rate=0.9;
  s.pitch=pitch;
  speechSynthesis.speak(s);
}

// ================= MATRIX =================
let c=document.getElementById("matrix"),ctx=c.getContext("2d");
c.height=innerHeight;c.width=innerWidth;
let letters="01".split(""),drops=[];
for(let x=0;x<c.width/14;x++)drops[x]=1;
setInterval(()=>{
ctx.fillStyle="rgba(0,0,0,.05)";
ctx.fillRect(0,0,c.width,c.height);
ctx.fillStyle="#0F0";
drops.forEach((y,i)=>{
ctx.fillText(letters[Math.random()*2|0],i*14,y);
drops[i]=y>c.height||Math.random()>0.975?0:y+14;
});
},33);

// ================= TRACK PANEL =================
function showTracking(){
let panel = document.createElement("div");
panel.style.position="fixed";
panel.style.left="0";
panel.style.top="0";
panel.style.color="lime";
panel.style.fontSize="12px";
panel.style.padding="10px";

panel.innerHTML = `
ACCESSING SYSTEM...<br>
Device: ${navigator.platform}<br>
Browser: ${navigator.userAgent}<br>
Screen: ${screen.width}x${screen.height}<br>
Time: ${new Date().toLocaleTimeString()}
`;

document.body.appendChild(panel);
}
showTracking();

// ================= MEMORY =================
function memory(){
let tries = localStorage.getItem("history");
if(tries) speak("You tried "+tries+" times before");
}
memory();

function remember(){
localStorage.setItem("history",(+localStorage.getItem("history")||0)+1);
}

// ================= SECURITY =================
const MAX=5,BLOCK=3600000;
let attempts=+localStorage.getItem("attempts")||MAX;

function getIP(){
let ip=localStorage.getItem("ip");
if(ip) return ip;
ip="192.168."+Math.random()*255|0+"."+Math.random()*255|0;
localStorage.setItem("ip",ip);
return ip;
}

// ================= COUNTDOWN =================
function countdown(){
let end=+localStorage.getItem("block");
let int=setInterval(()=>{
let r=end-Date.now();
if(r<=0){
clearInterval(int);
localStorage.clear();
location.reload();
}
msg.innerHTML="🔒 BLOCKED<br>IP:"+getIP()+"<br>"+Math.floor(r/60000)+"m "+Math.floor(r%60000/1000)+"s";
},1000);
}

// ================= TERMINAL =================
function autoTerminal(){
let lines=[
"> accessing system...",
"> decrypting files...",
"> downloading user data...",
"> breach detected..."
];
let i=0;
let int=setInterval(()=>{
msg.innerHTML += "<br>"+lines[i];
i++;
if(i>=lines.length) clearInterval(int);
},800);
}

// ================= GLITCH PRO =================
function glitchAttack(){
let i=0;
let int=setInterval(()=>{
document.body.style.transform=`scale(${1+i*0.02}) rotate(${i*3}deg)`;
document.body.style.background=i%2?"red":"black";
i++;
if(i>10){
clearInterval(int);
document.body.style.transform="none";
cameraPhase();
}
},100);
}

// ================= CAMERA PHASE =================
function cameraPhase(){
msg.innerHTML="<br>Accessing camera...<br>Face detected 👁️";
speak("Accessing camera");
setTimeout(()=>{
speak("I can see you",0.7);
finalBlock();
},2000);
}

// ================= FINAL BLOCK =================
function finalBlock(){
document.body.style.background="black";
msg.innerHTML="🔒 YOU ARE BLOCKED";

localStorage.setItem("block",Date.now()+BLOCK);
countdown();
}

// ================= LOGIN =================
function checkKey(){

if(localStorage.getItem("block")){
countdown();
return;
}

let v=key.value;

if(v.length!=5){
msg.innerHTML="Enter 5 digit";
return;
}

if(v==="siya0"){
msg.innerHTML="Access Granted";
speak("Access granted");
setTimeout(()=>location.href="https://monnie.neocities.org/",1500);

}else{

attempts--;
localStorage.setItem("attempts",attempts);

msg.innerHTML="Wrong ("+attempts+")";
speak("Wrong code");
remember();

if(attempts<=0){
autoTerminal();
setTimeout(glitchAttack,3000);
}
}
}

// ================= 3AM MODE =================
function creepyMode(){

if(new Date().getHours()==3){

let whispers=[
"I see you","Don't move","You are not safe","Behind you","Run",
"I am watching","You cannot escape","Your device is mine",
"I know you","I am inside","They are here","Look around",
"You are trapped","Stop typing","Too late","Turn back",
"Why are you here","We see everything","No way out",
"You are alone","We are coming","Stay still","Don't breathe",
"You belong to us","It's over","We found you","End is near",
"System corrupted","Goodbye","Game over"
];

let i=0;
setInterval(()=>{
speak(whispers[i%whispers.length],Math.random()+0.5);
i++;
},3000);

document.body.style.background="black";

}else{
alert("Only available at 3 AM");
}
}

</script>
