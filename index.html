<script>

let maxAttempts = 5;
let blockDuration = 60 * 60 * 1000; // 1 hour

// Fake IP generator
function getFakeIP(){
  return "192.168." + Math.floor(Math.random()*255) + "." + Math.floor(Math.random()*255);
}

// Show countdown
function startCountdown(){
  let msg = document.getElementById("msg");
  let blockedUntil = localStorage.getItem("blockedUntil");

  if(!blockedUntil) return;

  let interval = setInterval(()=>{
    let remaining = blockedUntil - Date.now();

    if(remaining <= 0){
      clearInterval(interval);
      localStorage.removeItem("blockedUntil");
      localStorage.setItem("attempts", maxAttempts);
      msg.innerHTML = "System Unlocked ✅";
      return;
    }

    let minutes = Math.floor(remaining/60000);
    let seconds = Math.floor((remaining%60000)/1000);

    msg.innerHTML =
      "🔒 IP BLOCKED<br>" +
      "IP: " + getFakeIP() + "<br>" +
      "Try again in: " + minutes + "m " + seconds + "s";
  },1000);
}

// Check if blocked on load
window.onload = function(){
  if(localStorage.getItem("blockedUntil")){
    startCountdown();
    speak("System is locked");
  } else {
    speak("Please enter 5 digit key");
  }
}

// Attempts
let attempts = localStorage.getItem("attempts") || maxAttempts;

function checkKey(){

  let msg = document.getElementById("msg");

  // If blocked
  if(localStorage.getItem("blockedUntil")){
    startCountdown();
    return;
  }

  let val = document.getElementById("key").value;

  if(val.length !== 5){
    msg.innerHTML = "Enter 5 digit code";
    speak("Enter 5 digit code");
    return;
  }

  if(val === "siya0"){
    msg.innerHTML = "Access Granted";
    speak("Access granted");

    localStorage.removeItem("attempts");

    setTimeout(()=>{
      window.location.href = "https://monnie.neocities.org/";
    },1500);

  } else {

    attempts--;
    localStorage.setItem("attempts", attempts);

    msg.innerHTML = "Wrong code (" + attempts + " left)";
    speak("Wrong code");

    if(navigator.vibrate) navigator.vibrate(300);
    beep();

    if(attempts <= 0){
      let blockUntil = Date.now() + blockDuration;
      localStorage.setItem("blockedUntil", blockUntil);

      msg.innerHTML = "🔒 IP BLOCKED!";
      speak("IP blocked for one hour");

      startCountdown();
    }
  }
}

</script>
